<svg viewBox="0 0 400 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dotsPattern" patternUnits="userSpaceOnUse" width="10" height="10">
      <circle cx="5" cy="5" r="1.3" fill="#7a4a00" opacity="0.55"/>
    </pattern>
    <clipPath id="petalClip">
      <path d="M 0,-110 C 38,-100 52,-55 0,0 C -52,-55 -38,-100 0,-110 Z"/>
    </clipPath>
  </defs>

  <!-- Yellow petal (top-left) with dot pattern -->
  <g transform="translate(200,180) rotate(-45)">
    <path d="M 0,-110 C 38,-100 52,-55 0,0 C -52,-55 -38,-100 0,-110 Z" fill="#F5BE1E"/>
    <g clip-path="url(#petalClip)">
      <rect x="-60" y="-115" width="120" height="120" fill="url(#dotsPattern)"/>
    </g>
  </g>

  <!-- Blue petal (top-right) with concentric circles -->
  <g transform="translate(200,180) rotate(45)">
    <path d="M 0,-110 C 38,-100 52,-55 0,0 C -52,-55 -38,-100 0,-110 Z" fill="#1F6FA8"/>
    <g transform="translate(0,-65)">
      <circle cx="0" cy="0" r="4" fill="white"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="white" stroke-width="1.6"/>
      <circle cx="0" cy="0" r="17" fill="none" stroke="white" stroke-width="1.6"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="white" stroke-width="1.6"/>
    </g>
  </g>

  <!-- Green petal (bottom-left) with fingerprint pattern -->
  <g transform="translate(200,180) rotate(-135)">
    <path d="M 0,-110 C 38,-100 52,-55 0,0 C -52,-55 -38,-100 0,-110 Z" fill="#1FA15A"/>
    <g stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round">
      <path d="M -22,-30 Q 0,-50 22,-30"/>
      <path d="M -24,-42 Q 0,-62 24,-42"/>
      <path d="M -25,-54 Q 0,-74 25,-54"/>
      <path d="M -24,-66 Q 0,-86 24,-66"/>
      <path d="M -20,-78 Q 0,-95 20,-78"/>
      <path d="M -14,-88 Q 0,-100 14,-88"/>
    </g>
  </g>

  <!-- Red petal (bottom-right) with star burst -->
  <g transform="translate(200,180) rotate(135)">
    <path d="M 0,-110 C 38,-100 52,-55 0,0 C -52,-55 -38,-100 0,-110 Z" fill="#D63A38"/>
    <g transform="translate(0,-65)" stroke="#FFD24A" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-25"/>
      <line x1="0" y1="0" x2="0" y2="25"/>
      <line x1="0" y1="0" x2="-25" y2="0"/>
      <line x1="0" y1="0" x2="25" y2="0"/>
      <line x1="0" y1="0" x2="-18" y2="-18"/>
      <line x1="0" y1="0" x2="18" y2="18"/>
      <line x1="0" y1="0" x2="-18" y2="18"/>
      <line x1="0" y1="0" x2="18" y2="-18"/>
      <line x1="0" y1="0" x2="-10" y2="-22"/>
      <line x1="0" y1="0" x2="10" y2="22"/>
      <line x1="0" y1="0" x2="22" y2="-10"/>
      <line x1="0" y1="0" x2="-22" y2="10"/>
    </g>
    <circle cx="0" cy="-65" r="3" fill="#FFD24A"/>
  </g>

  <!-- School name in Arabic -->
  <text x="200" y="385" text-anchor="middle" fill="#1A4A6B" font-size="30" font-weight="900" font-family="Tajawal, Arial, sans-serif">مدارس جواثا الأهلية</text>

  <!-- School name in English -->
  <text x="200" y="420" text-anchor="middle" fill="#1A4A6B" font-size="20" font-weight="700" font-family="Arial, sans-serif" letter-spacing="0.5">Jawatha Private School</text>
</svg>
