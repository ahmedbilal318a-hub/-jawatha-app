<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد جواثا الذكي - اسأل الذكاء الاصطناعي</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container ai-page">
        <header class="page-header ai-header">
            <div class="header-content">
                <div class="logo-mini">
                    <img src="jawatha-logo-new.png" alt="شعار مدارس جواثا" class="logo-img-small">
                    <div>
                        <h1>🤖 مساعد جواثا الذكي</h1>
                        <p>اسأل أي سؤال دراسي واحصل على شرح فوري يساعدك على الفهم</p>
                    </div>
                </div>
                <a href="index.html" class="back-btn">→ الرئيسية</a>
            </div>
        </header>

        <main class="ai-chat-wrapper">
            <div class="ai-chat-card">
                <div id="aiMessages" class="ai-messages">
                    <div class="ai-msg ai-msg-bot">
                        <div class="ai-avatar">🤖</div>
                        <div class="ai-bubble">
                            مرحباً بك! أنا مساعد جواثا الذكي 👋<br>
                            اسألني عن أي درس أو فكرة لم تفهمها، وسأشرحها لك خطوة بخطوة.
                            <div class="ai-suggestions">
                                <button class="ai-suggestion">اشرح لي قاعدة الفاعل والمفعول به</button>
                                <button class="ai-suggestion">ما الفرق بين المد والشدة؟</button>
                                <button class="ai-suggestion">لخّص لي درس الجملة الاسمية</button>
                            </div>
                        </div>
                    </div>
                </div>

                <form id="aiForm" class="ai-input-bar">
                    <textarea id="aiInput" rows="1" placeholder="اكتب سؤالك هنا..." autocomplete="off"></textarea>
                    <button type="submit" id="aiSend" class="ai-send-btn" aria-label="إرسال">➤</button>
                </form>
                <p class="ai-disclaimer">⚠️ المساعد الذكي قد يخطئ أحياناً — راجع المعلومات المهمة مع معلمك.</p>
            </div>
        </main>

        <footer class="page-credit">Created by Ahmed Belal</footer>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="supabase-init.js"></script>
    <script src="ai-chat.js"></script>
</body>
</html>
